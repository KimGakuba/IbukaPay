<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>IbukaPay - Expense Registration</title>
        <h:outputStylesheet library="css" name="style.css"/>
        <style type="text/css">
            /* internal (embedded) CSS - only used on this page */
            .amount-box {
                background: #f0f9ff;
                border-radius: 8px;
                padding: 18px;
                border: 1px solid #bae6fd;
            }
        </style>
    </h:head>
    <h:body>
        <div class="navbar">
            <span class="brand">IBUKAPAY</span>
            <span class="nav-links">
                <h:link outcome="index" value="Home"/>
                <h:link outcome="expenseRegistration" value="Register Expense"/>
                <h:link outcome="expenseList" value="Expenses"/>
                <h:outputText value="Welcome, #{userManagementBean.currentUser.username}"
                              style="margin-left:14px; font-weight:bold; color:#fcd34d"/>
                <a href="#{request.contextPath}/logout" style="color:#d1fae5; margin-left:12px; text-decoration:none">Logout</a>
            </span>
        </div>

        <div class="container">
            <div class="card">
                <h1 class="page-title" style="margin-top:0">Register a New Expense</h1>
                <p class="section-note">Due date must be today or a future date. A pending expense is
                    automatically flagged as overdue after its due date passes.</p>
                <h:form>
                    <h:messages globalOnly="false" styleClass="error-box" infoStyleClass="info-box"/>
                    <div class="amount-box">
                        <h:panelGrid columns="3" styleClass="form-grid"
                                     columnClasses="form-label,form-input,form-msg">
                            <h:outputLabel for="expenseId" value="Expense ID *"
                                           style="color:#0284c7;font-weight:bold"/>
                            <h:inputText id="expenseId" value="#{expense.expenseId}" required="true"
                                         requiredMessage="Expense ID is required" label="Expense ID">
                                <f:validateLength minimum="5" maximum="5"/>
                                <f:validateRegex pattern="[A-Za-z0-9]{5}"/>
                            </h:inputText>
                            <h:message for="expenseId" style="color:red"/>

                            <h:outputLabel for="description" value="Description *"/>
                            <h:inputText id="description" value="#{expense.description}" required="true"
                                         requiredMessage="Description is required" label="Description">
                                <f:validateLength minimum="5" maximum="100"/>
                            </h:inputText>
                            <h:message for="description" style="color:red"/>

                            <h:outputLabel for="amount" value="Amount (RWF) *"/>
                            <h:inputText id="amount" value="#{expense.amount}" required="true"
                                         requiredMessage="Amount is required" label="Amount">
                                <f:validateDoubleRange minimum="0.01"/>
                            </h:inputText>
                            <h:message for="amount" style="color:red"/>

                            <h:outputLabel for="dueDate" value="Due Date (yyyy-MM-dd) *"/>
                            <h:inputText id="dueDate" value="#{expense.dueDate}" required="true"
                                         requiredMessage="Due date is required" label="Due Date">
                                <f:convertDateTime pattern="yyyy-MM-dd"/>
                            </h:inputText>
                            <h:message for="dueDate" style="color:red"/>

                            <h:outputLabel for="status" value="Status *"/>
                            <h:selectOneMenu id="status" value="#{expense.status}" required="true"
                                             requiredMessage="Status is required" label="Status">
                                <f:selectItem itemValue="" itemLabel="-- select --"/>
                                <f:selectItem itemValue="PENDING" itemLabel="PENDING"/>
                                <f:selectItem itemValue="PAID" itemLabel="PAID"/>
                                <f:selectItem itemValue="OVERDUE" itemLabel="OVERDUE"/>
                            </h:selectOneMenu>
                            <h:message for="status" style="color:red"/>
                        </h:panelGrid>
                    </div>
                    <p style="margin-top:20px">
                        <h:commandButton value="Save Expense" styleClass="btn"
                                         action="#{expenseManagementBean.saveExpenseRecord(expense)}"/>
                        <h:button value="Cancel" outcome="expenseList" styleClass="btn btn-secondary"/>
                    </p>
                </h:form>
</div>
        </div>
    </h:body>
</f:view>
</html>
