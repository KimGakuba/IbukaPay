<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>IbukaPay - Create Account</title>
        <h:outputStylesheet library="css" name="style.css"/>
        <style type="text/css">
            /* internal (embedded) CSS - only used on this page */
            .auth-card {
                max-width: 420px;
                margin: 60px auto;
            }
            .inline-links {
                text-align: center;
                margin-top: 18px;
                font-size: 14px;
            }
            .hint {
                text-align: center;
                font-size: 13px;
                color: #6b7280;
                margin-top: 14px;
            }
        </style>
    </h:head>
    <h:body>
        <div class="navbar">
            <span class="brand">IBUKAPAY</span>
            <span class="nav-links">
                <h:outputText value="Create an account to access the system"/>
            </span>
        </div>

        <div class="container">
            <div class="card auth-card">
                <h1 class="page-title" style="text-align:center; margin-bottom:20px">Create an account</h1>
                <h:messages styleClass="msg"/>

                <h:form>
                    <div class="field">
                        <label for="username">Username</label>
                        <h:inputText id="username" value="#{user.username}" required="true"
                                     requiredMessage="Username is required" title="Username">
                            <f:validateLength minimum="3" maximum="20"/>
                            <f:validateRegex pattern="[a-zA-Z0-9_]+"/>
                        </h:inputText>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <h:inputSecret id="password" value="#{user.password}" redisplay="true"
                                       required="true" requiredMessage="Password is required"
                                       title="Password">
                            <f:validateLength minimum="6" maximum="50"/>
                        </h:inputSecret>
                    </div>
                    <div class="field">
                        <label for="confirmPassword">Confirm password</label>
                        <h:inputSecret id="confirmPassword" value="#{userManagementBean.confirmPassword}"
                                       required="true" requiredMessage="Please confirm your password"
                                       title="Confirm password"/>
                    </div>
                    <h:commandButton value="Register" action="#{userManagementBean.register(user)}"
                                     styleClass="btn btn-block"/>
                </h:form>

                <p class="inline-links">
                    Already registered? <h:link outcome="login" value="Sign in"/>
                </p>
                <p class="hint">All accounts share the same USER scope - the system has no privileged accounts.</p>
            </div>
        </div>
    </h:body>
</f:view>
</html>
