<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>IbukaPay - Sign In</title>
        <h:outputStylesheet library="css" name="style.css"/>
        <style type="text/css">
            /* internal (embedded) CSS - only used on this page */
            .auth-card {
                max-width: 420px;
                margin: 60px auto;
            }
            .inline-links {
                text-align: center;
                margin-top: 18px;
                font-size: 14px;
            }
            .hint {
                text-align: center;
                font-size: 13px;
                color: #6b7280;
                margin-top: 14px;
            }
        </style>
    </h:head>
    <h:body>
        <div class="navbar">
            <span class="brand">IBUKAPAY</span>
            <span class="nav-links">
                <h:outputText value="Sign in to access the system"/>
            </span>
        </div>

        <div class="container">
            <div class="card auth-card">
                <h1 class="page-title" style="text-align:center; margin-bottom:10px">Sign in</h1>
                <p style="text-align:center; margin:0 0 20px; color:#4b5563; font-size:14px; line-height:1.5">
                    IbukaPay helps you organise your expenses and avoid late
                    payments through automated reminders. Sign in to record your
                    payment obligations, track their status and get notified
                    before a due date passes.
                </p>
                <h:messages styleClass="msg"/>

                <h:form>
                    <div class="field">
                        <label for="username">Username</label>
                        <h:inputText id="username" value="#{userManagementBean.username}"
                                     required="true" requiredMessage="Username is required"
                                     title="Username"/>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <h:inputSecret id="password" value="#{userManagementBean.password}"
                                       required="true" requiredMessage="Password is required"
                                       title="Password"/>
                    </div>
                    <h:commandButton value="Sign in" action="#{userManagementBean.login()}"
                                     styleClass="btn btn-block"/>
                </h:form>

                <p class="inline-links">
                    No account yet? <h:link outcome="register" value="Create an account"/>
                </p>
                <p class="hint">Default account: user/user123</p>
            </div>
        </div>
    </h:body>
</f:view>
</html>
