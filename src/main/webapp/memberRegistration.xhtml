<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>IbukaPay - Member Registration</title>
        <h:outputStylesheet library="css" name="style.css"/>
        <style type="text/css">
            /* internal (embedded) CSS - only used on this page */
            .panel-box {
                background: #f8fafc;
                border-radius: 8px;
                padding: 18px;
                border: 1px solid #e2e8f0;
            }
        </style>
    </h:head>
    <h:body>
        <div class="navbar">
            <span class="brand">IBUKAPAY</span>
            <span class="nav-links">
                <h:link outcome="index" value="Home"/>
                <h:link outcome="expenseRegistration" value="Register Expense"/>
                <h:link outcome="expenseList" value="Expenses"/>
                <h:outputText value="Welcome, #{userManagementBean.currentUser.username}"
                              style="margin-left:14px; font-weight:bold; color:#fcd34d"/>
                <a href="#{request.contextPath}/logout" style="color:#d1fae5; margin-left:12px; text-decoration:none">Logout</a>
            </span>
        </div>

        <div class="container">
            <div class="card">
                <h1 class="page-title" style="margin-top:0">Register a New Member</h1>
                <p class="section-note">Fields marked with * are required. Validation: JSF tags, Bean
                    Validation annotations and programmatic server-side checks.</p>
                <h:form>
                    <h:messages globalOnly="false" styleClass="error-box" infoStyleClass="info-box"/>
                    <div class="panel-box">
                        <h:panelGrid columns="3" styleClass="form-grid" columnClasses="form-label,form-input,form-msg">
                            <h:outputLabel for="memberId" value="Member ID *"
                                           style="color:#0f766e;font-weight:bold"/>
                            <h:inputText id="memberId" value="#{member.memberId}" required="true"
                                         requiredMessage="Member ID is required" label="Member ID">
                                <f:validateLength minimum="5" maximum="5"/>
                                <f:validateRegex pattern="[A-Za-z0-9]{5}"/>
                            </h:inputText>
                            <h:message for="memberId" style="color:red"/>

                            <h:outputLabel for="firstName" value="First Name *"/>
                            <h:inputText id="firstName" value="#{member.firstName}" required="true"
                                         requiredMessage="First name is required" label="First Name">
                                <f:validateLength minimum="2" maximum="30"/>
                            </h:inputText>
                            <h:message for="firstName" style="color:red"/>

                            <h:outputLabel for="lastName" value="Last Name *"/>
                            <h:inputText id="lastName" value="#{member.lastName}" required="true"
                                         requiredMessage="Last name is required" label="Last Name">
                                <f:validateLength minimum="3" maximum="30"/>
                            </h:inputText>
                            <h:message for="lastName" style="color:red"/>

                            <h:outputLabel for="gender" value="Gender *"/>
                            <h:selectOneMenu id="gender" value="#{member.gender}" required="true"
                                             requiredMessage="Gender is required" label="Gender">
                                <f:selectItem itemValue="" itemLabel="-- select --"/>
                                <f:selectItem itemValue="MALE" itemLabel="Male"/>
                                <f:selectItem itemValue="FEMALE" itemLabel="Female"/>
                            </h:selectOneMenu>
                            <h:message for="gender" style="color:red"/>

                            <h:outputLabel for="age" value="Age *"/>
                            <h:inputText id="age" value="#{member.age}" required="true"
                                         requiredMessage="Age is required" label="Age">
                                <f:validateLongRange minimum="0" maximum="150"/>
                            </h:inputText>
                            <h:message for="age" style="color:red"/>

                            <h:outputLabel for="email" value="Email *"/>
                            <h:inputText id="email" value="#{member.email}" required="true"
                                         requiredMessage="Email is required" label="Email">
                                <f:validateRegex
                                        pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"/>
                            </h:inputText>
                            <h:message for="email" style="color:red"/>

                            <h:outputLabel for="phone" value="Phone (optional)"/>
                            <h:inputText id="phone" value="#{member.phoneNumber}" label="Phone">
                                <f:validateRegex pattern="[0-9+\- ]{10,15}"/>
                            </h:inputText>
                            <h:message for="phone" style="color:red"/>
                        </h:panelGrid>
                    </div>
                    <p style="margin-top:20px">
                        <h:commandButton value="Register Member" styleClass="btn"
                                         action="#{memberManagementBean.saveMemberRecord(member)}"/>
                        <h:button value="Cancel" outcome="memberList" styleClass="btn btn-secondary"/>
                    </p>
                </h:form>
</div>
        </div>
    </h:body>
</f:view>
</html>
