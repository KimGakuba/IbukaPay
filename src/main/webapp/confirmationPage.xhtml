<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>IbukaPay - Confirmation</title>
        <h:outputStylesheet library="css" name="style.css"/>
        <style type="text/css">
            /* internal (embedded) CSS - only used on this page */
            .thankyou {
                font-size: 24px;
                color: #065f46;
                text-align: center;
            }
            .summary {
                background: #ecfdf5;
                border: 1px solid #6ee7b7;
                border-radius: 8px;
                padding: 16px;
                margin: 18px 0;
            }
        </style>
    </h:head>
    <h:body>
        <div class="navbar">
            <span class="brand">IBUKAPAY</span>
            <span class="nav-links">
                <h:link outcome="index" value="Home"/>
                <h:link outcome="expenseRegistration" value="Register Expense"/>
                <h:link outcome="expenseList" value="Expenses"/>
                <h:outputText value="Welcome, #{userManagementBean.currentUser.username}"
                              style="margin-left:14px; font-weight:bold; color:#fcd34d"/>
                <a href="#{request.contextPath}/logout" style="color:#d1fae5; margin-left:12px; text-decoration:none">Logout</a>
            </span>
        </div>

        <div class="container">
            <div class="card" style="text-align:center">
                <h1 class="thankyou" style="border-bottom:none">Thank you!</h1>
                <h:messages globalOnly="false" styleClass="error-box" infoStyleClass="info-box"/>

                <!-- recap shown after a member registration -->
                <h:panelGroup layout="block" styleClass="summary" rendered="#{not empty member.memberId}">
                    <p style="margin:4px 0">
                        Member <b style="color:#0f766e">#{member.memberId}</b>
                        was registered successfully with names
                        <b>#{member.firstName} #{member.lastName}</b>.
                    </p>
                </h:panelGroup>

                <!-- recap shown after an expense registration -->
                <h:panelGroup layout="block" styleClass="summary" rendered="#{not empty expense.expenseId}">
                    <p style="margin:4px 0">
                        Expense <b style="color:#0f766e">#{expense.expenseId}</b>
                        (#{expense.description}) of
                        <b>
                            <h:outputText value="#{expense.amount}">
                                <f:convertNumber pattern="#,##0.00"/>
                            </h:outputText>
                            RWF
                        </b>
                        due on <b>#{expense.formattedDueDate}</b> was registered.
                    </p>
                    <p style="margin:4px 0">
                        <h:outputText value="Member: #{expense.member.memberId} - #{expense.member.firstName} #{expense.member.lastName}"
                                      rendered="#{not empty expense.member}"/>
                    </p>
                </h:panelGroup>

                <p style="margin:24px 0">
                    <h:link outcome="expenseList" value="View expenses" styleClass="btn btn-secondary"/>
                    <h:link outcome="index" value="Back to home" styleClass="btn"
                            style="margin-left:10px"/>
                </p>
</div>
        </div>
    </h:body>
</f:view>
</html>
