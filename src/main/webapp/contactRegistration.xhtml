<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<f:view>
    <h:head>
        <meta charset="UTF-8"/>
        <title>IbukaPay - Contact Registration</title>
        <h:outputStylesheet library="css" name="style.css"/>
        <style type="text/css">
            /* internal (embedded) CSS - only used on this page */
            .panel-box {
                background: #f8fafc;
                border-radius: 8px;
                padding: 18px;
                border: 1px solid #e2e8f0;
            }
            .contact-title {
                color: #7c3aed;
            }
        </style>
    </h:head>
    <h:body>
        <div class="navbar">
            <span class="brand">IBUKAPAY</span>
            <span class="nav-links">
                <h:link outcome="index" value="Home"/>
                <h:link outcome="contactRegistration" value="Register Contact"/>
                <h:link outcome="contactList" value="Contacts"/>
                <h:link outcome="financialRecordRegistration" value="Register Record"/>
                <h:link outcome="financialRecordList" value="Records"/>
            </span>
        </div>

        <div class="container">
            <div class="card">
                <h1 class="page-title contact-title" style="margin-top:0">Register a New Contact</h1>
                <p class="section-note">Fields marked with * are required. Validation: JSF tags, Bean
                    Validation annotations and programmatic server-side checks.</p>
                <h:form>
                    <h:messages globalOnly="false" styleClass="error-box" infoStyleClass="info-box"/>
                    <div class="panel-box">
                        <h:panelGrid columns="3" styleClass="form-grid" columnClasses="form-label,form-input,form-msg">
                            <h:outputLabel for="contactCode" value="Contact Code *"
                                           style="color:#7c3aed;font-weight:bold"/>
                            <h:inputText id="contactCode" value="#{contact.contactCode}" required="true"
                                         requiredMessage="Contact code is required" label="Contact Code">
                                <f:validateLength minimum="5" maximum="5"/>
                                <f:validateRegex pattern="[A-Z0-9]{5}"/>
                            </h:inputText>
                            <h:message for="contactCode" style="color:red"/>

                            <h:outputLabel for="contactName" value="Contact Name *"/>
                            <h:inputText id="contactName" value="#{contact.contactName}" required="true"
                                         requiredMessage="Contact name is required" label="Contact Name">
                                <f:validateLength minimum="3" maximum="60"/>
                            </h:inputText>
                            <h:message for="contactName" style="color:red"/>

                            <h:outputLabel for="contactPhoneNumber" value="Phone Number *"/>
                            <h:inputText id="contactPhoneNumber" value="#{contact.contactPhoneNumber}"
                                         required="true" requiredMessage="Phone number is required"
                                         label="Phone Number">
                                <f:validateRegex pattern="[0-9+\- ]{10,15}"/>
                            </h:inputText>
                            <h:message for="contactPhoneNumber" style="color:red"/>

                            <h:outputLabel for="contactEmail" value="Email *"/>
                            <h:inputText id="contactEmail" value="#{contact.contactEmail}"
                                         required="true" requiredMessage="Email is required"
                                         label="Email">
                                <f:validateRegex
                                        pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"/>
                            </h:inputText>
                            <h:message for="contactEmail" style="color:red"/>

                            <h:outputLabel for="notes" value="Notes"/>
                            <h:inputTextarea id="notes" value="#{contact.notes}" rows="3" cols="30"
                                             label="Notes">
                                <f:validateLength maximum="255"/>
                            </h:inputTextarea>
                            <h:message for="notes" style="color:red"/>
                        </h:panelGrid>
                    </div>
                    <p style="margin-top:20px">
                        <h:commandButton value="Register Contact" styleClass="btn"
                                         action="#{contactManagementBean.saveContactRecord(contact)}"/>
                        <h:button value="Cancel" outcome="contactList" styleClass="btn btn-secondary"/>
                    </p>
                </h:form>
            </div>
        </div>
    </h:body>
</f:view>
</html>
